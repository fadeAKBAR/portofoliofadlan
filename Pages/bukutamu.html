<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono&display=swap');

        /* --- PENGATURAN DASAR --- */
        body {
            background: radial-gradient(circle at top right, #1a0b2e 0%, #0b1021 50%, #000000 100%);
            font-family: 'Space Mono', monospace;
            color: #e0f7fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.7;
        }

        /* --- WADAH UTAMA BUKU TAMU --- */
        .kartu-profil {
            background: rgba(16, 24, 43, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 40px 45px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.15), inset 0 0 15px rgba(0, 212, 255, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        h1, h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 { font-size: 2.2rem; margin-top: 0; margin-bottom: 30px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 212, 255, 0.3); padding-bottom: 10px; }

        /* --- FORM BUKU TAMU --- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            color: #b388ff;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #e0f7fa;
            font-family: 'Space Mono', monospace;
            padding: 12px 15px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            background: rgba(0, 212, 255, 0.05);
        }

        /* --- TOMBOL --- */
        .btn-grup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button.btn-submit, a.btn-kembali {
            color: #00d4ff;
            text-decoration: none;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.5);
            padding: 12px 25px;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button.btn-submit:hover, a.btn-kembali:hover {
            background: #00d4ff;
            color: #000;
            box-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
            border-color: #00d4ff;
            transform: translateY(-3px);
        }
        
        button.btn-submit:disabled {
            background: #333; color: #777; border-color: #555; box-shadow: none; cursor: not-allowed; transform: none;
        }

        /* --- PESAN STATUS --- */
        #status-pesan {
            margin-top: 15px; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; display: none;
        }
        .sukses { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.6); }
        .error { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.6); }
        .loading { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.6); }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.8), transparent);
            margin: 35px 0;
        }

        /* --- DAFTAR PESAN (REALTIME) --- */
        .daftar-pesan-container {
            margin-top: 30px;
            text-align: left;
        }

        .scroll-area {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: #00d4ff rgba(0,0,0,0.3);
        }
        
        .scroll-area::-webkit-scrollbar { width: 8px; }
        .scroll-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }

        .pesan-item {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid #00d4ff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 10px 10px 0;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-in-out;
        }

        .pesan-item:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .pesan-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            align-items: center;
        }

        .pesan-nama {
            color: #b388ff;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .pesan-waktu {
            color: #666;
            font-size: 0.75rem;
        }

        .pesan-isi {
            font-size: 0.95rem;
            word-break: break-word;
            margin: 0;
        }

        .keterangan-loading {
            text-align: center;
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Responsif */
        @media (max-width: 600px) {
            .btn-grup { flex-direction: column-reverse; gap: 15px; }
            .btn-grup a, .btn-grup button { width: 100%; box-sizing: border-box; }
            .pesan-header { flex-direction: column; align-items: flex-start; }
            .pesan-waktu { margin-top: 5px; }
        }
    </style>
</head>
<body>

    <div class="kartu-profil">
        <h1>Buku Tamu Digital</h1>
        
        <!-- FORM BUKU TAMU -->
        <form id="form-buku-tamu" name="submit-to-google-sheet">
            <div class="form-group">
                <label for="nama">NAMA LENGKAP</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
            </div>
            
            <div class="form-group">
                <label for="email">EMAIL / KONTAK</label>
                <input type="text" id="email" name="email" required placeholder="Alamat Email atau No WA">
            </div>

            <div class="form-group">
                <label for="pesan">PESAN & KESAN</label>
                <textarea id="pesan" name="pesan" rows="4" required placeholder="Tuliskan pesan Anda..."></textarea>
            </div>

            <div class="btn-grup">
                <a href="../index.html" class="btn-kembali">&#9664; KEMBALI</a>
                <button type="submit" class="btn-submit">KIRIM PESAN</button>
            </div>
        </form>

        <div id="status-pesan"></div>

        <hr>

        <!-- BAGIAN TAMPILAN PESAN (REALTIME) -->
        <div class="daftar-pesan-container">
            <h2>Pesan Terbaru</h2>
            <div id="loading-pesan" class="keterangan-loading">Memuat pesan...</div>
            <div id="tempat-pesan" class="scroll-area">
                <!-- Pesan dari spreadsheet akan dirender di sini -->
            </div>
        </div>
    </div>

    <!-- Script Integrasi ke Google Spreadsheet (Google Apps Script) -->
    <script>
        // PENTING: Ganti string di bawah ini dengan URL Web App dari Google Apps Script Anda (yang baru dideploy)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxEEyzoINXfvLsXX9wJWxgukVaVLbs1I9S30dLJBKFyGl70S75pfjuNRGV2kYwypQOi/exec';
        
        const form = document.forms['submit-to-google-sheet'];
        const btnSubmit = document.querySelector('.btn-submit');
        const statusPesan = document.getElementById('status-pesan');
        const tempatPesan = document.getElementById('tempat-pesan');
        const loadingPesan = document.getElementById('loading-pesan');

        // Fungsi untuk mengambil data dari Google Spreadsheet
        function ambilPesan() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    loadingPesan.style.display = 'none';
                    tempatPesan.innerHTML = ''; // Kosongkan area pesan sebelum diisi
                    
                    if(data.data && data.data.length > 0) {
                        // Membalik urutan agar pesan terbaru (paling bawah di sheet) muncul paling atas
                        const pesanTerbaru = data.data.reverse(); 
                        
                        pesanTerbaru.forEach(item => {
                            // Membuat elemen HTML untuk setiap pesan
                            const htmlPesan = `
                                <div class="pesan-item">
                                    <div class="pesan-header">
                                        <span class="pesan-nama">${escapeHTML(item.nama)}</span>
                                        <span class="pesan-waktu">${item.waktu}</span>
                                    </div>
                                    <p class="pesan-isi">${escapeHTML(item.pesan)}</p>
                                </div>
                            `;
                            tempatPesan.insertAdjacentHTML('beforeend', htmlPesan);
                        });
                    } else {
                        tempatPesan.innerHTML = '<p style="text-align:center; color:#666;">Belum ada pesan. Jadilah yang pertama!</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data!', error);
                    loadingPesan.innerHTML = 'Gagal memuat pesan.';
                    loadingPesan.style.color = '#ff0055';
                });
        }

        // Fungsi untuk mencegah serangan XSS (Cross-Site Scripting) pada input user
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Jalankan fungsi ambilPesan saat halaman pertama kali dimuat
        window.onload = ambilPesan;

        // Fungsi saat form disubmit
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Animasi loading pada tombol
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'MENGIRIM...';
            statusPesan.className = 'loading';
            statusPesan.innerHTML = 'Memproses data ke server...';
            statusPesan.style.display = 'block';

            // Menyimpan form data
            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData})
                .then(response => response.json())
                .then(data => {
                    // Sukses
                    statusPesan.className = 'sukses';
                    statusPesan.innerHTML = 'Pesan berhasil dikirim! Memperbarui daftar pesan...';
                    form.reset();
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'KIRIM PESAN';
                    
                    // Sembunyikan notifikasi setelah 5 detik
                    setTimeout(() => {
                        statusPesan.style.display = 'none';
                    }, 5000);

                    // Menampilkan pesan baru secara realtime dengan animasi
                    const nama = formData.get('nama');
                    const pesan = formData.get('pesan');
                    const waktuSekarang = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

                    const htmlPesanBaru = `
                        <div class="pesan-item" style="border-left-color: #00ffcc;">
                            <div class="pesan-header">
                                <span class="pesan-nama">${escapeHTML(nama)}</span>
                                <span class="pesan-waktu">Baru saja</span>
                            </div>
                            <p class="pesan-isi">${escapeHTML(pesan)}</p>
                        </div>
                    `;
                    // Sisipkan di paling atas daftar pesan
                    tempatPesan.insertAdjacentHTML('afterbegin', htmlPesanBaru);
                    
                    // Atau bisa juga memanggil ulang fungsi ambilPesan()
                    // ambilPesan(); 
                })
                .catch(error => {
                    // Error
                    statusPesan.className = 'error';
                    statusPesan.innerHTML = 'Gagal mengirim pesan. Pastikan URL Script Google sudah benar.';
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'KIRIM PESAN';
                    console.error('Error!', error.message);
                });
        });
    </script>
</body>
</html>
